name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Pin the npm major: `npm@latest` floating to a new major (e.g. 12) has
      # changed `npm pack --json` output and broken the package smoke test
      # mid-release. npm >= 11.5 is required for OIDC trusted publishing.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run build

      - run: npm run test:coverage

      - run: npm run test:package

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:e2e

      - run: npm publish --access public

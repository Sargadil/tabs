<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tabs e2e — disabled tabs (custom navigation)</title>
</head>
<body>
<main>
<h1>Tabs e2e — disabled tabs, custom navigation</h1>
<div class="tabs" id="tabs">
    <div class="custom-tabs__nav">
        <div class="custom-tabs__nav-inner">
            <button class="custom-tabs__nav-button" role="tab">Docs</button>
            <button class="custom-tabs__nav-button" role="tab" disabled>Support</button>
            <div class="custom-tabs__nav-button" role="tab" tabindex="-1" aria-disabled="true">Settings</div>
        </div>
    </div>
    <div class="tabs__panels">
        <div class="tab-panel"><h2 class="tab-panel__title">Docs</h2><div class="tab-panel__content">Docs content</div></div>
        <div class="tab-panel"><h2 class="tab-panel__title">Support</h2><div class="tab-panel__content">Support content</div></div>
        <div class="tab-panel"><h2 class="tab-panel__title">Settings</h2><div class="tab-panel__content">Settings content</div></div>
    </div>
</div>
<script type="module">
    import Tabs from '/dist/js/tabs.mjs';
    window.tabsInstance = new Tabs({
        classes: {
            tabsNavContainer: '.custom-tabs__nav',
            tabsNavList: '.custom-tabs__nav-inner',
            tabsNavButton: '.custom-tabs__nav-button',
        },
        options: { useCustomNav: true, ariaLabel: 'Sections' },
    });
</script>
</main>
</body>
</html>
